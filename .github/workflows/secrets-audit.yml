name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0

      - name: Install just
        env:
          JUST_VERSION: 1.51.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Install pinned ores-sops audit helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ores-sops-bin"
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/ORESoftware/ores-sops/f152c11f76cc14b2af440b47c756b6c97c0aa36b/ores-sops' \
            --output "$RUNNER_TEMP/ores-sops-bin/ores-sops"
          echo "be990d1d6e4df75b3e6bcc8f183018879554844db054997394bc0d31eed4c5ef  $RUNNER_TEMP/ores-sops-bin/ores-sops" | sha256sum --check --status
          chmod 0755 "$RUNNER_TEMP/ores-sops-bin/ores-sops"
          echo "$RUNNER_TEMP/ores-sops-bin" >> "$GITHUB_PATH"

      - name: just env-check
        run: just env-check
