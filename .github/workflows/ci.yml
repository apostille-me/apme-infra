name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust formatting and lint
        run: |
          cargo fmt --manifest-path tools/infra-contract-check/Cargo.toml --all --check
          cargo clippy --manifest-path tools/infra-contract-check/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust contract regression tests
        run: cargo test --manifest-path tools/infra-contract-check/Cargo.toml --all-targets
      - name: Validate infrastructure source with Rust
        run: |
          cargo run --manifest-path tools/infra-contract-check/Cargo.toml -- --root .
          bash -n scripts/*.sh
